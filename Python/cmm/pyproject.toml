[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for small LLMs using constrained decoding."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.9",
    "pytest>=8.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:cannot collect test class 'TestPrompt':UserWarning"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = "(\\.venv|llm_sdk|data|build|dist)/"

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "skip"
