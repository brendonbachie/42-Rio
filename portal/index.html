<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acesso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.5rem; }
        p  { color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        a  {
            display: inline-block;
            background: #00babc;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover { background: #009a9c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bem-vindo</h1>
        <p>Faça login com sua conta da 42 para acessar a internet.</p>
        <a id="login-btn" href="#">Entrar com a 42</a>
    </div>

    <script>
        // Captura os parâmetros passados pelo pfSense via portal.html
        const params   = new URLSearchParams(window.location.search);
        const action   = params.get('action')   || '';
        const redirurl = params.get('redirurl') || '';
        const zone     = params.get('zone')     || '';

        // Monta o link de login apontando pro callback.php com os parâmetros do pfSense
        const clientId = 'u-s4t2ud-8fe2066e7f8e31ce4f1c8dff09942727a4adda6790d73f90c1c22e9b156abef4';
        const redirectUri = encodeURIComponent('https://unspasmodically-perigynous-lael.ngrok-free.dev/callback.php');
        const state       = encodeURIComponent(JSON.stringify({ action, redirurl, zone }));

        document.getElementById('login-btn').href =
            'https://api.intra.42.fr/oauth/authorize'
            + '?client_id='     + clientId
            + '&redirect_uri='  + redirectUri
            + '&response_type=code'
            + '&state='         + state;
    </script>
</body>
</html>
